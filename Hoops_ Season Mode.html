<script>
const $=i=>document.getElementById(i),rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),sh=a=>{for(let i=a.length;--i;){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function league(){const c=['Boston','New York','Philadelphia','Miami','Washington D.C.','Milwaukee','Chicago','Detroit','Nashville','Cleveland','Seattle','Portland','San Francisco','Los Angeles','Phoenix','Denver','Dallas','Houston','St. Louis','New Orleans'],n=sh(NICKS.slice());TM=c.map((ct,i)=>({id:i,city:ct,name:ct+' '+n[i],off:ri(60,90),def:ri(60,90),div:i/5|0,conf:i/10|0,w:0,l:0,pf:0,pa:0,hue:ri(0,359)}));const mk=TM[5];mk.name='Milwaukee Brew Kings';mk.hue=140}
